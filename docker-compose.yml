name: fireflies

include:
  - path: backend/docker-compose.yml
  - path: frontend/docker-compose.yml

services:
  api:
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:?set ASSEMBLYAI_API_KEY in .env}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
  web:
    environment:
      API_URL: http://api:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
    depends_on:
      api:
        condition: service_started
        required: true
